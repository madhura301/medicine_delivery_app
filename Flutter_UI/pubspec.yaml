name: pharmaish
description: Pharmaish Mobile App

publish_to: 'none'

version: 1.0.2+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  # shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0 
  # Location & Maps
  geolocator: ^9.0.2
  geocoding: ^2.1.1
  # Map picker (OpenStreetMap tiles — no API key required)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

 # File handling
  file_picker: ^8.0.0+1
  image_picker: ^1.0.7
  # Direct deps so the Android System Photo Picker can be switched on
  # (ImagePickerAndroid.useAndroidPhotoPicker) - see utils/media_pickers.dart
  image_picker_android: ^0.8.12
  image_picker_platform_interface: ^2.10.0
  camera: ^0.10.5+9
  path: ^1.8.3
  path_provider: ^2.1.2
  
  # Audio recording & playback
  # record: ^5.0.4
  # audioplayers: ^5.2.1
  flutter_sound: ^9.2.13

   # Permissions
  permission_handler: ^11.2.0

  # WhatsApp icon
  font_awesome_flutter: ^10.7.0
  # flutter_svg: ^2.0.9
  url_launcher: ^6.3.0
  # UI & Icons
  cupertino_icons: ^1.0.2
  
  # State Management
  flutter_bloc: ^8.1.3

  # # Prevent Screen Recording
  # flutter_windowmanager: ^0.2.0
  # screen_protector: ^1.4.2
  
  # Network & Storage
  dio: ^5.3.2
  shared_preferences: ^2.2.2

  # Payments
  razorpay_flutter: ^1.3.7
  
  # Utils
  intl: ^0.18.1
  
  # Logging
  logger: ^2.0.2+1

  # For device info logging
  device_info_plus: ^9.1.0  
  open_filex: ^4.7.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/images/payments/
    
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  # The P mark on its own, with no wordmark - this is what the Android launcher
  # icon already shows, and iOS must match it. An app icon renders as small as
  # 40x40pt, where the PHARMAISH wordmark and tagline in
  # "logo_for_opening page.png" are an illegible smudge.
  # full_logo_animated.png is the same mark without any text.
  image_path: "assets/images/full_logo_animated.png"
  min_sdk_android: 21
  # iOS app icons must be opaque (no alpha) for the App Store.
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  web:
    generate: true
    image_path: "assets/images/logo_for_opening page.png"

# Native launch screen, shown before the Flutter engine boots. Without this the
# iOS LaunchImage asset is Flutter's 68-byte placeholder and the app opens on a
# blank white screen ("flutter build ipa" flags this under App Icon and Launch
# Image Assets Validation).
#
# Deliberately mirrors SplashPage (core/screens/splash/splash_page.dart), which
# is a white Scaffold showing opening_logo_animated.png centred. Using the same
# image and background here means the native screen hands off to the Flutter one
# with no visible jump. Unlike the app icon, the wordmark belongs here: the logo
# is drawn large, so the text is legible.
#
# Regenerate after changing anything below:
#   flutter pub get && dart run flutter_native_splash:create
flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/opening_logo_animated.png"
  ios: true
  android: true
  web: false
  # Android 12+ ignores the legacy splash and uses its own windowSplashScreen API.
  android_12:
    color: "#ffffff"
    image: "assets/images/opening_logo_animated.png"